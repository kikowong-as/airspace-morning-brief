name: daily-brief
on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: airspace-brief
jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - name: Generate site
        run: python run.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          FEEDBACK_URL: ${{ secrets.FEEDBACK_URL }}
          BUTTON_URL: ${{ secrets.BUTTON_URL }}
      - name: Commit site & state
        run: |
          git config user.name "airspace-bot"; git config user.email "bot@users.noreply.github.com"
          git add docs/ state/ && (git diff --cached --quiet || git commit -m "brief $(date -u +%F)")
          git pull --rebase && git push
