name: weekly-feedback
on:
  schedule:
    - cron: "0 1 * * 1"       # 每週一 UTC 01:00 = 台灣 09:00
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: airspace-brief
jobs:
  weekly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python run.py weekly
        env:
          FEEDBACK_CSV_URL: ${{ secrets.FEEDBACK_CSV_URL }}
      - run: |
          git config user.name "airspace-bot"; git config user.email "bot@users.noreply.github.com"
          git add docs/ state/ && (git diff --cached --quiet || git commit -m "weekly $(date -u +%F)")
          git pull --rebase && git push
