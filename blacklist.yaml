# drop：第一層直接丟掉的雜訊（成人、博弈、詐騙廣告等），不會出現在原料清單
drop: [成人, 色情, 博弈, 娛樂城, 威而鋼, 貸款, 代操, 外送茶]

# red_keywords：第二層命中就強制 🔴 不可借（規則優先於 AI）。仍會在信末「不可借」列出，讓小編知道要避開
red_keywords:
  # 災難
  [地震, 颱風, 海嘯, 火災, 爆炸, 空難, 墜機, 土石流, 淹水,
  # 案件
   車禍, 命案, 殺人, 槍擊, 性侵, 詐騙, 墜樓, 輕生, 自殺,
  # 傷病死亡
   過世, 逝世, 病逝, 身亡, 死亡, 噩耗, 罹癌,
  # 政治
   立委, 總統, 罷免, 公投, 選舉, 國民黨, 民進黨, 民眾黨, 兩岸, 共軍, 戰爭]
