# ── 來源設定 ───────────────────────────────────────────────
# tier : A 第一階段 / B 第二階段
# zone : news = 區一「今日時事熱點」 / style = 區二「穿搭與消費趨勢」
# type : google_trends | rss | google_news | dcard | youtube | youtube_search | html
# verify: true = 網址或選擇器需先用 tools/probe.py 在可連網環境驗證；
#         html 類來源預設 enabled:false，填好 url + selector 驗證後再打開
settings:
  phase: 1              # 1 = 只跑 A 級；2 = A + B 級
  top_news: 10          # 區一最多分析幾則
  top_style: 6          # 區二最多分析幾則
  cluster_threshold: 0.45   # 沒有 embedding 時的字面相似度門檻
  embed_threshold: 0.82     # 有 embedding 時的餘弦相似度門檻

sources:
  # ── A 級 ──
  - {name: Google Trends, tier: A, zone: news, type: google_trends, url: "https://trends.google.com/trending/rss?geo=TW", weight: 1.5, enabled: true}
  - {name: Yahoo 頭條, tier: A, zone: news, type: rss, url: "https://tw.news.yahoo.com/rss", weight: 1.0, enabled: true, verify: true}
  - {name: Yahoo 娛樂, tier: A, zone: news, type: rss, url: "https://tw.news.yahoo.com/rss/entertainment", weight: 1.0, enabled: true, verify: true}
  - {name: Yahoo 生活, tier: A, zone: news, type: rss, url: "https://tw.news.yahoo.com/rss/lifestyle", weight: 0.8, enabled: true, verify: true}
  - {name: ETtoday, tier: A, zone: news, type: rss, url: "https://feeds.feedburner.com/ettoday/realtime", weight: 1.0, enabled: true, verify: true}
  - {name: Dcard, tier: A, zone: news, type: dcard, url: "https://www.dcard.tw/service/api/v2/posts?popular=true&limit=30", weight: 1.2, enabled: true}
  - {name: YouTube 熱門, tier: A, zone: news, type: youtube, weight: 1.0, enabled: true}   # 需要 YOUTUBE_API_KEY
  - {name: LINE TODAY, tier: A, zone: news, type: html, url: "", selector: "", weight: 1.0, enabled: false, verify: true}
  - {name: 噓！星聞, tier: A, zone: news, type: html, url: "", selector: "", weight: 0.8, enabled: false, verify: true}
  - {name: 蝦皮熱搜, tier: A, zone: style, type: html, url: "", selector: "", weight: 1.0, enabled: false, verify: true}
  - {name: momo 熱銷榜, tier: A, zone: style, type: html, url: "", selector: "", weight: 1.0, enabled: false, verify: true}

  # ── B 級（第二階段）──
  - {name: Threads, tier: B, zone: news, type: html, url: "", selector: "", weight: 1.2, limit: 5, enabled: false, verify: true}
  - {name: X 台灣趨勢, tier: B, zone: news, type: html, url: "", selector: "", weight: 1.2, enabled: false, verify: true}
  - {name: TikTok Creative Center, tier: B, zone: style, type: html, url: "", selector: "", weight: 1.0, enabled: false, verify: true}
  - {name: Pinterest Trends, tier: B, zone: style, type: html, url: "", selector: "", weight: 1.0, enabled: false, verify: true}
  - {name: Vogue Taiwan, tier: B, zone: style, type: rss, url: "", weight: 0.8, enabled: false, verify: true}
  - {name: ELLE Taiwan, tier: B, zone: style, type: rss, url: "", weight: 0.8, enabled: false, verify: true}
  - {name: GQ Taiwan, tier: B, zone: style, type: rss, url: "", weight: 0.8, enabled: false, verify: true}
  - {name: WEAR, tier: B, zone: style, type: html, url: "", selector: "", weight: 0.8, enabled: false, verify: true}
  - {name: Musinsa, tier: B, zone: style, type: html, url: "", selector: "", weight: 0.8, enabled: false, verify: true}
  - {name: Lookbook, tier: B, zone: style, type: html, url: "", selector: "", weight: 0.8, enabled: false, verify: true}

  # ── 區二（穿搭與消費趨勢）自動來源：用關鍵字抓近 7 天的 Google 新聞標題與 YouTube 熱門影片 ──
  # 關鍵字男女並列（Airspace 以女性為主，r.fav 支線有男性）。每個關鍵字算一個來源，同一事件跨關鍵字出現會加分。
  - {name: "Google 新聞：穿搭", tier: A, zone: style, type: google_news, query: "穿搭", when: 7d, weight: 1.0, enabled: true, verify: true}
  - {name: "Google 新聞：男生穿搭", tier: A, zone: style, type: google_news, query: "男生穿搭", when: 7d, weight: 1.0, enabled: true, verify: true}
  - {name: "Google 新聞：女生穿搭", tier: A, zone: style, type: google_news, query: "女生穿搭", when: 7d, weight: 1.0, enabled: true, verify: true}
  - {name: "Google 新聞：服裝流行", tier: A, zone: style, type: google_news, query: "服裝 流行趨勢", when: 7d, weight: 1.0, enabled: true, verify: true}
  - {name: "Google 新聞：潮流單品", tier: A, zone: style, type: google_news, query: "潮流 單品", when: 7d, weight: 1.0, enabled: true, verify: true}
  - {name: "YouTube：穿搭", tier: A, zone: style, type: youtube_search, query: "穿搭", days: 7, weight: 0.8, enabled: true}
  - {name: "YouTube：男生穿搭", tier: A, zone: style, type: youtube_search, query: "男生穿搭", days: 7, weight: 0.8, enabled: true}
